services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram_stack_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: db_telegram_bot
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d db_telegram_bot']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: telegram_stack_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: ../telegram-ai-bot
      dockerfile: ../telegram-bot-docker/Dockerfile.backend.prod
    container_name: telegram_stack_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.backend.prod
    environment:
      DATABASE_URL: postgresql://postgres:change_me@postgres:5432/db_telegram_bot?schema=public
      WEBHOOK_PORT: 3000
      PORT: 5505
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: sh -c "cd /app && npx prisma db push --schema=./prisma/schema.prisma && npm start"
    ports:
      - '5505:5505'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ../order-bot-dashboard
      dockerfile: ../telegram-bot-docker/Dockerfile.frontend.prod
    container_name: telegram_stack_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.frontend.prod
    environment:
      NODE_ENV: production
    ports:
       - '5506:5506'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data_prod:
  redis_data_prod:
