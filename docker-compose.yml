services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram_stack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: db_telegram_bot
    ports:
      - '5284:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d db_telegram_bot']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../telegram-ai-bot
      dockerfile: ../telegram-bot-docker/Dockerfile.backend
    container_name: telegram_stack_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.backend
    environment:
      DATABASE_URL: postgresql://postgres:my_password@postgres:5432/db_telegram_bot?schema=public
      WEBHOOK_PORT: 3000
      NODE_ENV: development
      PUBLIC_BASE_URL: https://69c7-202-46-68-1.ngrok-free.app
    working_dir: /app
    command: sh -c "npm run db:push && npm run dev"
    volumes:
      - ../telegram-ai-bot:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '5505:3000'

  frontend:
    build:
      context: ../order-bot-dashboard
      dockerfile: ../telegram-bot-docker/Dockerfile.frontend
    container_name: telegram_stack_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5505
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    working_dir: /app
    command: sh -c "npm run dev -- -H 0.0.0.0 -p 3000"
    volumes:
      - ../order-bot-dashboard:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
