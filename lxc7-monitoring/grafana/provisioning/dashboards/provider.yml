# Provider dashboard — Fase 5
# File JSON di /var/lib/grafana/dashboards (mount ./grafana/dashboards).
# Sumber dashboard (dicek 16 Nov 2026):
#   1860  Node Exporter Full          -> node-exporter-full.json
#   10347 Proxmox via Prometheus      -> proxmox-via-prometheus.json
#   14282 cAdvisor exporter           -> cadvisor-exporter.json
