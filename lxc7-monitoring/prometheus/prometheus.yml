# Scrape config Prometheus (lxc-7) — Fase 5
# Target: host Proxmox 10.0.2.15, lxc-6 10.0.2.25, URL publik via blackbox.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node-exporter di lxc-6 (network host)
  - job_name: lxc6-node
    static_configs:
      - targets: ["10.0.2.25:9100"]

  # cAdvisor di lxc-6 (8082 -> 8080 container)
  - job_name: lxc6-cadvisor
    static_configs:
      - targets: ["10.0.2.25:8082"]

  # Metrik per LXC lewat Proxmox API (token read-only, lihat pve-exporter/pve.yml)
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["10.0.2.15"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  # Uptime URL publik
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sellgram.coreapps.web.id
          - https://sellgram-api.coreapps.web.id/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
